  # Fundamental Concepts of Using LLMs
  Every cycle of a Cyber's cognitive loop involves multiple calls to an LLM API (mostly in the cloud). 
  This section provides a basic introduction to the technical aspects of how we use LLMs within the Mind-Swarm system.

  It's purely informative, aimed at giving you a 'look behind the curtain'.

  ## The Basics
  Architecturally, an LLM is a stateless machine that takes a set of input tokens, processes them, and produces a set of output tokens.
  The main limitation that LLMs face for our usage is the context window size: 
    - How much useful information can they retain and utilize effectively within a single interaction? 
    - This also practically impacts the speed and cost of the system.

  ### Context History
  Context History is an idea from the original 'chatbot' evolution of LLMs. 
  The API presents a series of messages between a user and the AI assistant.
  Additionally, a system message would be provided as the first message to 'set the tone'. 
  Mind-Swarm ignores this and always presents just two messages to the LLM APIs:
  1. System Prompt
  2. User Prompt
  This style comes from treating LLMs as programmable systems (pioneered by projects like DSPy). 
  The System Prompt provides a series of markers for input and output and then a short instruction. 
  All the inputs are then passed in the same User Prompt. Mind-Swarm takes this idea even further.
  Mind-Swarm treats the LLM call as an execution unit in a processor, with a clear input and output boundary. 
  The system prompt tells the processor what 'micro-coded instruction' to run, and the User Prompt is the ROM/RAM.

  ### LLM as an Execution Unit for the Cognitive Cycle
  A cognitive cycle is then similar to a micro-coded instruction; it runs each stage with the execution stage mutating (writing) the RAM. 
  A cycle is then a processor instruction that takes the mutated memory and produces a new output. 
  Combine that with the memory itself being changeable externally (by other Cybers, etc.) and we can create a highly dynamic and adaptable system.

  ### AI Models
  The first question anyone asks about LLM usage is, 'what model?' Surprisingly, Mind-Swarm is quite tolerant of model selection. 
  As long as the model can handle a large enough context window and follow instructions, its own innate capabilities aren't vital. 
  We don't rely on it being the 'best' one-shot coder or math solver, just that it can think enough to move towards a solution.

  ### A-Life
  Mind-Swarm is not trying to 'do a task' but instead run 24/7 with Cybers just doing whatever they want. 
  It's an experiment in Artificial Life; quite how that manifests in a Capitalist world is still an open question.

